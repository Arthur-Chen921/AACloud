<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AACloud · 小狗游乐场</title>
<style>
  :root {
    --sky-top: #16264a;
    --sky-bottom: #5f9fd1;
    --cloud: #f6fbff;
    --sun: #ffc94a;
    --ink: #0e1a33;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(var(--sky-top), var(--sky-bottom));
    color: var(--cloud);
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  header {
    position: fixed; top: env(safe-area-inset-top); left: 0; right: 0;
    padding: 18px 20px; pointer-events: none;
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .02em; }
  #hint { margin-top: 6px; font-size: .95rem; opacity: .9; max-width: 22em; line-height: 1.5; }
  #count { font-variant-numeric: tabular-nums; color: var(--sun); font-weight: 700; }
  footer {
    position: fixed; left: 0; right: 0; bottom: env(safe-area-inset-bottom);
    display: flex; gap: 10px; align-items: center; justify-content: space-between;
    padding: 14px 16px;
  }
  button {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--cloud);
    border: 0; border-radius: 999px; padding: 12px 20px; min-height: 44px; cursor: pointer;
  }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  #ver { font-size: .8rem; opacity: .7; text-align: right; }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>
<canvas id="sky" aria-label="点击天空会出现小狗"></canvas>
<header>
  <h1>小狗游乐场</h1>
  <p id="hint">点一下天空，召唤一只小狗。已召唤 <span id="count">0</span> 只。手指划过，它们会被你推开。</p>
</header>
<footer>
  <button id="clear" type="button">清空小狗</button>
  <div id="ver">版本 v2<br><span id="loaded"></span></div>
</footer>

<script>
(() => {
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const countEl = document.getElementById('count');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const dogs = [];
  const scenery = [];   // 背景里慢慢飘的云，不可互动
  let total = 0, W = 0, H = 0, dpr = 1, pointer = null;

  // 毛色: [脸, 耳朵, 口鼻]
  const COATS = [
    ['#f2c27b', '#c8893f', '#fbe6bf'],  // 金毛
    ['#fdfbf6', '#e0b98c', '#ffffff'],  // 小白
    ['#b98258', '#7d4f2e', '#e8c9a4'],  // 棕色
    ['#d9d9de', '#8f8f99', '#f4f4f7'],  // 灰色
    ['#f6d9a8', '#3b2a22', '#fff1d6'],  // 黑耳朵
  ];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  function addDog(x, y) {
    const r = 34 + Math.random() * 16;
    dogs.push({
      x, y, r,
      vx: (Math.random() - .5) * 1.6,
      vy: (Math.random() - .5) * 1.6,
      coat: COATS[Math.floor(Math.random() * COATS.length)],
      born: performance.now(),
      tilt: (Math.random() - .5) * .3,
      phase: Math.random() * 6.28
    });
    total++;
    countEl.textContent = total;
  }

  function ellipse(x, y, rx, ry, rot, fill) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function drawDog(d, now) {
    const age = (now - d.born) / 380;
    let s = 1;
    if (age < 1) {                    // 弹出动画
      const c1 = 1.70158, c3 = c1 + 1, t = age - 1;
      s = 1 + c3 * t * t * t + c1 * t * t;
    }
    const bob = reduce ? 0 : Math.sin(now / 420 + d.phase) * 3;
    const [face, ear, muzzle] = d.coat;
    const r = d.r;

    ctx.save();
    ctx.translate(d.x, d.y + bob);
    ctx.rotate(d.tilt + (reduce ? 0 : Math.sin(now / 700 + d.phase) * .05));
    ctx.scale(s, s);

    // 软阴影
    ellipse(0, r * 1.02, r * .8, r * .14, 0, 'rgba(10,20,50,.22)');
    // 耳朵（垂耳）
    ellipse(-r * .92, -r * .05, r * .38, r * .72, .25, ear);
    ellipse( r * .92, -r * .05, r * .38, r * .72, -.25, ear);
    // 脸
    ellipse(0, 0, r, r * .94, 0, face);
    // 口鼻
    ellipse(0, r * .34, r * .5, r * .38, 0, muzzle);
    // 腮红
    ellipse(-r * .62, r * .22, r * .15, r * .1, 0, 'rgba(255,125,150,.45)');
    ellipse( r * .62, r * .22, r * .15, r * .1, 0, 'rgba(255,125,150,.45)');
    // 眼睛 + 高光
    for (const sx of [-1, 1]) {
      ellipse(sx * r * .38, -r * .12, r * .13, r * .16, 0, '#1b1424');
      ellipse(sx * r * .38 + r * .04, -r * .18, r * .045, r * .05, 0, '#ffffff');
    }
    // 眉点
    ellipse(-r * .38, -r * .42, r * .06, r * .045, 0, 'rgba(60,40,30,.35)');
    ellipse( r * .38, -r * .42, r * .06, r * .045, 0, 'rgba(60,40,30,.35)');
    // 舌头
    ellipse(0, r * .66, r * .14, r * .17, 0, '#ff8aa1');
    // 嘴
    ctx.strokeStyle = '#3a2a2a';
    ctx.lineWidth = Math.max(1.5, r * .045);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, r * .36); ctx.lineTo(0, r * .46);
    ctx.moveTo(-r * .2, r * .52); ctx.quadraticCurveTo(-r * .1, r * .6, 0, r * .46);
    ctx.moveTo( r * .2, r * .52); ctx.quadraticCurveTo( r * .1, r * .6, 0, r * .46);
    ctx.stroke();
    // 鼻子
    ellipse(0, r * .3, r * .15, r * .1, 0, '#241a1f');
    ellipse(-r * .04, r * .27, r * .04, r * .025, 0, 'rgba(255,255,255,.7)');

    ctx.restore();
  }

  function drawCloud(c) {
    ctx.fillStyle = 'rgba(246,251,255,.55)';
    ctx.beginPath();
    for (const [dx, dy, s] of [[-.9,.2,.7],[-.3,-.3,.9],[.45,-.1,.8],[1,.25,.6],[0,.3,1]]) {
      const px = c.x + dx * c.r, py = c.y + dy * c.r, pr = s * c.r * .8;
      ctx.moveTo(px + pr, py);
      ctx.arc(px, py, pr, 0, Math.PI * 2);
    }
    ctx.fill();
  }

  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffc94a';
    ctx.beginPath(); ctx.arc(W * .82, H * .2, 34, 0, Math.PI * 2); ctx.fill();

    for (const c of scenery) {
      if (!reduce) { c.x += c.vx; if (c.x > W + c.r * 2) c.x = -c.r * 2; }
      drawCloud(c);
    }

    for (const d of dogs) {
      if (!reduce) {
        if (pointer) {
          const dx = d.x - pointer.x, dy = d.y - pointer.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 120 && dist > 0) { d.vx += dx / dist * .7; d.vy += dy / dist * .7; }
        }
        d.x += d.vx; d.y += d.vy;
        d.vx *= .985; d.vy *= .985;
        if (Math.hypot(d.vx, d.vy) < .25) { d.vx += (Math.random() - .5) * .08; d.vy += (Math.random() - .5) * .08; }
        const m = d.r;
        if (d.x < m) { d.x = m; d.vx = Math.abs(d.vx); }
        if (d.x > W - m) { d.x = W - m; d.vx = -Math.abs(d.vx); }
        if (d.y < m + 70) { d.y = m + 70; d.vy = Math.abs(d.vy); }
        if (d.y > H - m - 60) { d.y = H - m - 60; d.vy = -Math.abs(d.vy); }
      }
      drawDog(d, now);
    }
    requestAnimationFrame(frame);
  }

  cv.addEventListener('pointerdown', e => {
    pointer = { x: e.clientX, y: e.clientY };
    addDog(e.clientX, e.clientY);
  });
  cv.addEventListener('pointermove', e => {
    if (e.buttons || e.pointerType === 'touch') pointer = { x: e.clientX, y: e.clientY };
  });
  const release = () => { pointer = null; };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  document.getElementById('clear').addEventListener('click', () => {
    dogs.length = 0; total = 0; countEl.textContent = 0;
  });

  document.getElementById('loaded').textContent =
    '打开于 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

  for (let i = 0; i < 4; i++) {
    scenery.push({ x: Math.random() * W, y: H * (.25 + Math.random() * .5), r: 24 + Math.random() * 20, vx: .12 + Math.random() * .15 });
  }
  addDog(W * .5, H * .5);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
